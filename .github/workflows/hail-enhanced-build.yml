name: Hail Enhanced v1.11.0-enhanced.9 stable signed build

on:
  push:
    branches:
      - enhanced/backup-signing-v1
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hail-enhanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run migration exporter tests
        run: python3 -m unittest tools/test_legacy_export_hail_backup.py

      - name: Run Android unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Prepare permanent release signing
        id: signing
        env:
          HAIL_SIGNING_KEYSTORE_BASE64: ${{ secrets.HAIL_SIGNING_KEYSTORE_BASE64 }}
          HAIL_SIGNING_STORE_PASSWORD: ${{ secrets.HAIL_SIGNING_STORE_PASSWORD }}
          HAIL_SIGNING_KEY_ALIAS: ${{ secrets.HAIL_SIGNING_KEY_ALIAS }}
          HAIL_SIGNING_KEY_PASSWORD: ${{ secrets.HAIL_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$HAIL_SIGNING_KEYSTORE_BASE64" ] || [ -z "$HAIL_SIGNING_STORE_PASSWORD" ] || [ -z "$HAIL_SIGNING_KEY_ALIAS" ] || [ -z "$HAIL_SIGNING_KEY_PASSWORD" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not configured. Unit tests ran; signed APK build was skipped."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/hail-enhanced-release.jks"
          printf '%s' "$HAIL_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          keytool -list -keystore "$KEYSTORE_PATH" -storetype JKS -storepass "$HAIL_SIGNING_STORE_PASSWORD" -alias "$HAIL_SIGNING_KEY_ALIAS" >/dev/null
          echo "HAIL_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Compile release variant without publishing a debug-signed APK
        if: steps.signing.outputs.ready != 'true'
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Build permanently signed release APK
        if: steps.signing.outputs.ready == 'true'
        env:
          HAIL_REQUIRE_RELEASE_SIGNING: "true"
          HAIL_SIGNING_STORE_PASSWORD: ${{ secrets.HAIL_SIGNING_STORE_PASSWORD }}
          HAIL_SIGNING_KEY_ALIAS: ${{ secrets.HAIL_SIGNING_KEY_ALIAS }}
          HAIL_SIGNING_KEY_PASSWORD: ${{ secrets.HAIL_SIGNING_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature and checksum
        if: steps.signing.outputs.ready == 'true'
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          ACTUAL_FINGERPRINT="$(keytool -printcert -jarfile "$APK" | awk -F': ' '/SHA256:/{print $2; exit}')"
          EXPECTED_FINGERPRINT="AE:3C:A1:22:8D:75:91:7A:56:1A:A9:8E:FA:4B:59:59:AF:77:09:5E:1D:08:9D:26:67:3B:55:67:AF:A6:48:CB"
          test "$ACTUAL_FINGERPRINT" = "$EXPECTED_FINGERPRINT"
          echo "Verified certificate: $ACTUAL_FINGERPRINT"
          sha256sum "$APK"

      - name: Upload permanently signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Hail-Enhanced-v1.11.0-enhanced.9-signed
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
