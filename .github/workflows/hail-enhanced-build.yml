name: Hail Enhanced v1.11.0-enhanced.7 test build

on:
  push:
    branches:
      - enhanced/tag-editor-v1.11.0
      - enhanced/roadmap-v1.11.0
      - enhanced/tag-manager-redesign
      - enhanced/tag-manager-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and build release APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: Hail-Enhanced-v1.11.0-enhanced.7-test
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
